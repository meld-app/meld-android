name: Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Ensure Platform 35
        run: |
          SDKMANAGER=$(command -v sdkmanager || find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Run Unit Tests & Assemble APKs
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease

      - name: Package APK Artifact
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "$KEYSTORE_B64" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > /tmp/meld-release.jks
            export ANDROID_KEYSTORE_PATH=/tmp/meld-release.jks
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk dist/MELD-v2.1.0-beta.1-Android.apk
            rm -f /tmp/meld-release.jks
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/MELD-v2.1.0-beta.1-Android-unsigned.apk
          fi
          sha256sum dist/*.apk > dist/MELD-v2.1.0-beta.1-Android.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MELD-Android-APK
          path: dist/*
